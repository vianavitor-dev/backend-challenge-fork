services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "123"
      DATABASE_NAME: postgres
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: "123"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
