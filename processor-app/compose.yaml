services:
    web: 
        build: .
        ports:
          - 3000:3000
        depends_on:
            db:
                condition: service_healthy
    
    db:
        image: postgres:alpine
        environment:
            - POSTGRES_PASSWORD=123
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s